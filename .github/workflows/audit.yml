# Weekly self-audit: Claude checks a random sample of live headlines against what the rules decided
# (scripts/audit.mjs) and, if it suspects mistakes, opens an issue listing them as ready-to-paste test cases.
# Needs the ANTHROPIC_API_KEY repository secret; without it the run is skipped. Costs a few cents a week.
name: Headline audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v5
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
      - name: Ask Claude about a sample of headlines
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          npm install --no-save --no-package-lock @anthropic-ai/sdk
          node scripts/audit.mjs > audit.md
      - name: Open an issue with the suspected mistakes
        if: env.ANTHROPIC_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s audit.md ]; then
            gh issue create --repo "${{ github.repository }}" --title "Headline audit $(date -u +%Y-%m-%d)" --body-file audit.md
          else
            echo "No suspected mistakes this week."
          fi
