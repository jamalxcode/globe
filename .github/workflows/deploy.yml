# On every push, and hourly: check the headline rules against tests/headlines.json, then publish to GitHub
# Pages, with fresh satellite heat data (fires.json) when the FIRMS_MAP_KEY secret is set.
# If a check fails, nothing is published: the last good version stays live and GitHub emails the failure.
name: Test and deploy

on:
  push:
    branches: [main]
  # Hourly refresh of the satellite data (NASA updates it every few hours). GitHub's schedule can run late;
  # that's fine here.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check headline rules
        run: node tests/run.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Empty until the FIRMS_MAP_KEY repository secret is added; the satellite steps are then skipped.
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v5
      # Only the files the page needs; tests and scripts stay in the repo.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css favicon.svg app.js extract.js places.js cities.js provinces.js vendor _site/
      - uses: actions/setup-node@v5
        if: env.FIRMS_MAP_KEY != ''
        with:
          node-version: 22
      # Satellite heat near known cities. A failed download publishes the site without fires.json rather
      # than failing the deploy.
      - name: Satellite heat (NASA FIRMS)
        if: env.FIRMS_MAP_KEY != ''
        run: node scripts/fires.mjs > _site/fires.json || rm -f _site/fires.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
